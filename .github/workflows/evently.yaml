name: evently-brief-template

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: install packages
        run: npm ci

      - name: test
        run: npm test

      - name: Configure Git user
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"  

      - name: Merge dev into main
        run: |
          git fetch origin
          git checkout main
          git pull origin main
          git merge origin/dev --allow-unrelated-histories --strategy-option=theirs -m "CI: Auto-merge dev into main (force theirs)"

      - name: Push merge result
        env:
          TOKEN: ${{ secrets.PAT_MERGE }}
        run: |
          git push ${{ secrets.LINK }} main

  cd:
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: configure aws cred
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Upload to S3
        run: aws s3 sync dist s3://evently-brief --delete
