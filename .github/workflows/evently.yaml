name: evently-brief-template

on:
  push:
    branches: [feature/list-events]

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: action/checkout@v4

      - name: setup node
        uses: action/setup-node@v4
        with:
          node-version: 18

      - name: install packages
        run: npm ci

      - name: test
        run: npm test

      - name: merge to main
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

       
          git fetch origin main
          git checkout main


          git merge --no-ff origin/brOne -m "Auto-merge brOne into main after successful CI"

          git push origin main

   cd:
     runs-on: ubuntu-latest
     needs: ci
     if: github.ref == 'refs/heads/main'
     steps:
      
       - name: Checkout code
         uses: actions/checkout@v4

      
       - name: Set up Node.js
         uses: actions/setup-node@v4
         with:
          node-version: '20'

      
       - name: Install dependencies
         run: npm install

      
       - name: confuge aws cred
         uses: aws-actions/configure-aws-credentials@v1
         with:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS-REGION: eu-north-1


       - name: Upload to S3
         run: aws s3 sync dist s3://evently-brief --delete 


 
